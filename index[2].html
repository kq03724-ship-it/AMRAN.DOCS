const sha=async f=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",await f.arrayBuffer()))].map(x=>x.toString(16).padStart(2,"0")).join("");
const b64=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(",")[1]);r.onerror=no;r.readAsDataURL(f)});
const addLog=(action,name)=>db.doc("log/"+Date.now()+"-"+Math.random().toString(36).slice(2,6)).set({at:Date.now(),action,name,by:me}).catch(()=>{});
async function addFiles(files){if(!db||!assets)return bn(t(db?"noup":"nodb"));const res=[];
 for(const f of files){try{if(f.size>14*1048576){bn(t("big"));res.push(["skip",f.name]);continue}
  const m=f.name.match(/\.([^.]+)$/),ext=m?m[1].toLowerCase():"",stem=f.name.replace(/\.[^.]+$/,""),title=stem;
  const id=encodeURIComponent((title+"."+ext).toLowerCase()).replace(/%/g,"~").replace(/[!'()*]/g,"_").slice(0,150),cur=docs.get(id),hash=await sha(f);
  if(cur&&cur.current.hash==hash&&false){res.push(["same",f.name]);continue}
  const up=await assets.upload(new Blob([await b64(f)],{type:"text/plain"}),{type:"text/plain"});
  const v={aid:up.id,name:f.name,size:f.size,hash,at:Date.now(),by:me,rev:(stem.match(REV)||[])[1]||""};
  const versions=cur?[{...cur.current,archivedAt:Date.now()},...cur.versions].slice(0,50):[];
  const d={title,ext,current:v,versions,ref:$('#asref').checked||(cur?!!cur.ref:false)};if(cur){if(cur.code)d.code=cur.code;if(cur.cycle){d.cycle=cur.cycle;const _x=new Date();_x.setMonth(_x.getMonth()+cur.cycle);d.review=_x.getTime()}else if(cur.review)d.review=cur.review}await db.doc("docs/"+id).set(d);docs.set(id,d);addLog(cur?"Updated":"New",f.name);res.push([cur?"upd":"new",f.name])}catch(e){res.push(["skip",f.name])}}
 $("#res").innerHTML=res.map(([s,n])=>`<span class="chip ${s}">${t(s)}: ${esc(n)}</span>`).join("");render()}
const blobOf=async v=>{const s=await window.__assetText(v.aid),a=atob(s.trim()),u=new Uint8Array(a.length);for(let i=0;i<a.length;i++)u[i]=a.charCodeAt(i);return u};
const pick=k=>{const[i,n]=k.split(":"),d=docs.get(i);return d&&(n===undefined?d.current:d.versions[+n])};
async function save(name,data){try{await (await claude.use("downloads")).save({filename:name,data})}catch(e){}}
async function share(k){if(k=="x")return $("#mo").classList.remove("on");
 const z=new JSZip(),names=[];for(const id of sel){const d=docs.get(id);if(d){z.file(d.current.name,await blobOf(d.current));names.push(d.current.name)}}

 names.forEach(n=>addLog("Shared",n));$("#mo").classList.remove("on");sel.clear();render()}

 if(x.coll=='ver'){const d=docs.get(x.oid);const nd=d?{...d,versions:[x.data,...d.versions]}:{title:x.name.replace(/\.[^.]+$/,''),ext:(x.name.match(/\.([^.]+)$/)||[])[1]||'',current:x.data,versions:[]};await db.doc('docs/'+x.oid).set(nd);docs.set(x.oid,nd);await db.doc('trash/'+id).delete();trash.delete(id);addLog('Restored',x.name);return render()}const nid=(x.coll=='docs'?docs:recs).has(x.oid)?x.oid+'~r':x.oid;await db.doc(x.coll+'/'+nid).set(x.data);await db.doc('trash/'+id).delete();trash.delete(id);addLog('Restored',x.name);render()}

async function sendRec(){if(!db||!assets)return bn(t(db?'noup':'nodb'));const f=$('#rcf').files[0],v=$('#rcat').value,cat=v=='__o'?$('#rcu').value.trim():v;if(!f||!cat)return;if(f.size>14*1048576)return bn(t('big'));try{const up=await assets.upload(new Blob([await b64(f)],{type:'text/plain'}),{type:'text/plain'});await db.doc('rec/'+Date.now()+'-'+Math.random().toString(36).slice(2,6)).set({at:Date.now(),by:me,cat,date:$('#rdt').value||new Date().toISOString().slice(0,10),note:$('#rcn').value.trim(),file:{aid:up.id,name:f.name,size:f.size}});$('#rcf').value='';$('#rcn').value='';addLog('Record',cat+' · '+f.name)}catch(e){bn(t('skip'))}}

async function delForever(id){const d=docs.get(id);if(!d||role!='admin'||!confirm(t('tdel')))return;await rmAssets([d.current,...d.versions].map(v=>v.aid));await db.doc('docs/'+id).delete();docs.delete(id);addLog('Deleted',d.current.name);render()}
async function delVersion(k){const[i,n]=k.split(':'),d=docs.get(i);if(!d)return;const v=d.versions[+n];await db.doc('trash/v~'+i+'~'+Date.now()).set({coll:'ver',oid:i,data:v,at:Date.now(),by:me,name:v.name});const nd={...d,versions:d.versions.filter((_,j)=>j!=+n)};await db.doc('docs/'+i).set(nd);docs.set(i,nd);addLog('Deleted',v.name);toast(t('moved'));render()}
function panel(all){const p=$('#pn');if(!pn){p.style.display='none';return}let rows='';
 if(pn=='c2')rows=all.filter(d=>new Date(d.current.at).toDateString()==new Date().toDateString()).map(d=>`<div class="rc" style="border-inline-start:4px solid #1e9e63">${ft(d.ext)}<b>${esc(d.current.name)}</b> <span class="st ok">✔ ${t('valid')}</span> <small style="color:var(--mut)">${fd(d.current.at)} · ${esc(names[d.current.by])}</small></div>`).join('');
 if(pn=='c1')rows=all.filter(d=>!d.ref).map(d=>`<div class="rc" style="border-inline-start:4px solid #1e9e63">${ft(d.ext)}<b>${esc(d.current.name)}</b> <span class="st ok">✔ ${t('valid')}</span> <small style="color:var(--mut)">${fd(d.current.at)} · ${esc(names[d.current.by])}</small> <button class="lk" data-del="${esc(d.id)}" style="color:#d64545">🗑</button></div>`).join('');
 if(pn=='c3')rows+=all.flatMap(d=>d.versions.map((v,i)=>`<div class="rc" style="border-inline-start:4px solid #d64545">${ft(d.ext)}<b><s style="opacity:.75">${esc(v.name)}</s></b> <b class="st bad">✖ ${t('obsolete')}</b> <small style="color:var(--mut)">${fd(v.archivedAt)}</small> <button class="lk" data-rs="${esc(d.id)}:${i}">↩ ${t('rs')}</button><button class="lk" data-dl="${esc(d.id)}:${i}">${t('dl')}</button> <button class="lk" data-vdel="${esc(d.id)}:${i}" style="color:#d64545">🗑</button></div>`)).join('');
 if(pn=='c3'){rows+=all.filter(d=>d.ref).map(d=>`<div class="rc" style="border-inline-start:4px solid #d64545">${ft(d.ext)}<b><s style="opacity:.75">${esc(d.current.name)}</s></b> <b class="st bad">✖ ${t('obsolete')}</b> <small>${fd(d.current.at)}</small> <button class="lk" data-dl="${esc(d.id)}">${t('dl')}</button><button class="lk" data-ref="${esc(d.id)}">↩ ${t('tocur')}</button><button class="lk" data-del="${esc(d.id)}" style="color:#d64545">🗑</button></div>`).join('')}
 p.innerHTML=rows||`<div class="em">${t('ec')}</div>`;p.style.display='block'}
const ask=m=>new Promise(r=>{const o=document.createElement('div');o.className='mo on';o.innerHTML='<div class="md"><p style="margin:0 0 14px;font-size:16px"></p><button class="pb"></button><button class="pb g"></button></div>';o.querySelector('p').textContent=m;const[y,n]=o.querySelectorAll('button');y.textContent=t('yes');n.textContent=t('cancel');y.onclick=()=>{o.remove();r(true)};n.onclick=()=>{o.remove();r(false)};document.body.appendChild(o)});
const toast=m=>{const e=$('#tt');e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',6000)};
async function loadNames(){return;const ids=new Set();docs.forEach(d=>{ids.add(d.current.by);d.versions.forEach(v=>ids.add(v.by))});logs.forEach(l=>ids.add(l.by));reqs.forEach(r=>ids.add(r.by));ids.delete(undefined);ids.delete(null);const need=[...ids].filter(i=>!(i in names));if(!need.length)return;try{const p=await U.profiles(need);need.forEach(i=>names[i]=(p[i]&&p[i].name)||'');render()}catch(e){}}
async function sendReq(){if(!db)return bn(t('nodb'));const f=$('#rf').files[0],note=$('#rn').value.trim();if(!f&&!note)return;let file=null;try{if(f){if(f.size>14*1048576)return bn(t('big'));if(!assets)return bn(t('noup'));const up=await assets.upload(new Blob([await b64(f)],{type:'text/plain'}),{type:'text/plain'});file={aid:up.id,name:f.name,size:f.size}}
 await db.doc('req/'+Date.now()+'-'+Math.random().toString(36).slice(2,6)).set({at:Date.now(),by:me,kind:$('#rk').value,note,file,done:false});$('#rn').value='';$('#rf').value='';addLog('Request',f?f.name:note.slice(0,40))}catch(e){bn(t('skip'))}}
document.onclick=async e=>{const el=e.target,g=x=>el.closest(x);
 if(el.dataset.ref){const d=docs.get(el.dataset.ref);if(d){const nd={...d,ref:!d.ref};await db.doc('docs/'+el.dataset.ref).set(nd);docs.set(el.dataset.ref,nd);addLog(nd.ref?'Reference':'Restored',d.current.name);render()}return}
 if(el.dataset.hist){tab='arch';pn='';$('#q').value=el.dataset.hist;return render()}

  await db.doc("docs/"+i).set(nd);docs.set(i,nd);addLog("Restored",v.name);tab="cur";return render()}

html{-webkit-tap-highlight-color:transparent}
body{overscroll-behavior-y:none}
.hb,.tab,.pb,.lk,.bk,#bnav button,#st,.card{-webkit-user-select:none;user-select:none}
.hb:active,.pb:active,.lk:active,.bk:active{transform:scale(.96)}
#home{background:radial-gradient(120% 90% at 50% 0%,#1F4E79d9 0%,#12385ce6 45%,#0b2540f2 100%),var(--phA) center/cover,#0b2540!important}
#home::before{content:"";position:fixed;inset:-4%;z-index:-1;background:var(--phA) center/cover;opacity:.5;animation:kb 28s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1) translateY(0)}to{transform:scale(1.12) translateY(-2%)}}
#home .hwho{margin:-10px 0 0;font-size:12px;opacity:.65;text-align:center}
.hb.wide{grid-column:1/-1;flex-direction:row;align-items:center;gap:14px;background:linear-gradient(110deg,#2E9BD640,#ffffff14)}
.hb.wide .tile{order:1;margin:0}.hb.wide span{order:2;font-size:16px;font-weight:600}.hb.wide b{order:3;margin-inline-start:auto}
body.sc #st{min-height:108px;background:linear-gradient(105deg,#0b2540f5 6%,#1F4E79c4 52%,#1F4E7966),var(--phB) center/cover}
body.sc main{padding-bottom:112px}
body.sc #tt{bottom:calc(92px + env(safe-area-inset-bottom,0px))!important}
#bnav{position:fixed;inset-inline:0;bottom:0;z-index:15;display:none;justify-content:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
body.sc #bnav{display:flex}
#bnav .bi{pointer-events:auto;display:flex;gap:2px;width:100%;max-width:540px;background:#0b2540f0;border:1px solid #ffffff1f;border-radius:22px;padding:6px;box-shadow:0 12px 34px #0007;backdrop-filter:blur(12px)}
#bnav button{all:unset;box-sizing:border-box;flex:1;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:16px;color:#b9d3e8;font-size:11px;transition:background .25s,color .25s}
#bnav button .ic{width:21px;height:21px}
#bnav button.on{background:linear-gradient(135deg,#2E9BD6,#1F6FB0);color:#fff}
/* door v2 */
#door{direction:ltr}
#door i{background:linear-gradient(180deg,#0b2540,#12385c)}
#door i:first-child{border-right:2px solid #2E9BD6}#door i:last-child{border-left:2px solid #2E9BD6}
#door .dl{position:absolute;inset:0;display:grid;place-items:center;opacity:0}
#door .dl div{background:#fff;border-radius:18px;padding:10px 22px;box-shadow:0 12px 44px #0008}#door .dl img{height:58px;display:block}
/* dashboard */
#dashv{display:none}
body[data-s=dash] #dashv{display:block}
body[data-s=dash] main>*:not(#dashv){display:none!important}
#dashv .dh{border-radius:18px;padding:18px;color:#fff;margin-bottom:14px;background:linear-gradient(105deg,#0b2540f2 8%,#1F4E79b3 62%,#1F4E7955),var(--phB) center/cover;display:flex;align-items:center;gap:12px;flex-wrap:wrap}

<script>
(function(){
var SECS=['dash','cur','arch','req','rec','trash','act','usr'],GH={dash:'DASHBOARD',cur:'CURRENT',arch:'REFERENCE',req:'REQUESTS',rec:'RECORDS',trash:'TRASH',act:'ACTIVITY',usr:'USERS'};
var $h=function(s){return document.querySelector(s)},B=document.body,home=false,busy=false;
var RM=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
function cnt(k){try{
 if(k=='dash'){var q=dstat();return q.pct===null?'—':q.pct+'%'}
 if(k=='cur')return [...docs.values()].filter(function(d){return!d.ref}).length;
 if(k=='arch')return [...docs.values()].reduce(function(s,d){return s+d.versions.length+(d.ref?1:0)},0);
 if(k=='req')return [...reqs.values()].filter(function(x){return!x.done}).length;
 if(k=='rec')return recs.size;if(k=='trash')return trash.size;if(k=='act')return logs.length;if(k=='usr')return usersL.length;
}catch(e){}return 0}
function lab(k){return k=='dash'?z('لوحة التحليل','Analytics'):t(k)}
function build(){
 var g=$h('#hg');g.innerHTML=SECS.map(function(k){return '<button class="hb'+(k=='dash'?' wide':'')+'" type="button" data-go="'+k+'"><i class="tile"><i class="ic ic-'+k+'"></i></i><b>'+cnt(k)+'</b><span>'+lab(k)+'</span></button>'}).join('');
 $h('#hh1').textContent=t('h1');$h('#hwho').textContent=me?(L=='ar'?'مرحباً ':'Welcome, ')+me+' · '+t(role=='admin'?'radmin':'ruser'):'';$h('#hsub').textContent=t('sub');
 $h('#hlang').textContent=L=='ar'?'EN':'عربي';$h('#hout').textContent=t('lo');$h('#bk').textContent=(L=='ar'?'→ ':'← ')+(L=='ar'?'الرئيسية':'Home');
 dash();var iv=role=='admin',vt=L=='ar'?'مشاركة مستخدمين':'Share with users';['#hinv','#sinv'].forEach(function(i){var e=$h(i);if(e){e.style.display=iv?'':'none';e.textContent=vt}});var ub=g.querySelector('[data-go=usr]');if(ub&&role!='admin')ub.style.display='none';
 var im=$h('#home .hl img'),src=$h('.logo img');if(im&&src&&!im.src)im.src=src.src;
}
function door(fn){
 if(RM||!Element.prototype.animate){fn();return}
 busy=true;var d=[].slice.call(document.querySelectorAll('#door i')),lg=$h('#door .dl');
 var E='cubic-bezier(.7,0,.3,1)';
 var a=d.map(function(e){return e.animate([{transform:'scaleX(0)'},{transform:'scaleX(1)'}],{duration:420,easing:E,fill:'forwards'})});
 var l1=lg.animate([{opacity:0,transform:'scale(.88)'},{opacity:1,transform:'scale(1)'}],{duration:340,delay:150,easing:'ease-out',fill:'forwards'});
 a[0].onfinish=function(){fn();setTimeout(function(){
  var c=d.map(function(e){return e.animate([{transform:'scaleX(1)'},{transform:'scaleX(0)'}],{duration:540,easing:E,fill:'forwards'})});
  lg.animate([{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(1.08)'}],{duration:260,fill:'forwards'});
  c[0].onfinish=function(){d.concat([lg]).forEach(function(e){e.getAnimations().forEach(function(x){x.cancel()})});busy=false;intro()}},130)};
}
function showHome(){document.title='AMRAN Document Control';home=true;B.classList.remove('sc');B.removeAttribute('data-s');B.classList.add('hm');build();buildNav();scrollTo(0,0)}
function showSec(k){home=false;B.classList.remove('hm');B.classList.add('sc');B.setAttribute('data-s',k);tab=k;pn='';dashAnim=(k=='dash');render();document.title='AMRAN · '+lab(k);
 $h('#sth').innerHTML='<i class="ic ic-'+k+'"></i>'+lab(k);$h('#ghost').textContent=GH[k];build();buildNav();scrollTo(0,0)}
function go(k){if(busy)return;door(function(){showSec(k);try{history.pushState({s:k},'')}catch(e){}})}
function back(){if(busy)return;door(function(){showHome()})}
document.addEventListener('click',function(e){var x=e.target.closest&&e.target.closest('[data-go]');if(x&&x.closest('#home')){go(x.dataset.go);return}
 if(e.target.closest&&e.target.closest('#bk')){back();return}
 if(e.target.closest&&e.target.closest('#hlang')){$h('#lang').click();return}
 if(e.target.closest&&e.target.closest('#hinv,#sinv')){var iv=$h('#inv');if(iv)iv.click();return}
 if(e.target.closest&&e.target.closest('#hout')){$h('#lo').click();return}});
window.addEventListener('popstate',function(){if(!home&&B.classList.contains('sc'))showHome()});
var _e=window.enter;window.enter=function(){_e.apply(this,arguments);showHome()};
var _r=window.render;window.render=function(){try{usersL.forEach(function(u){if(u.auid)names[u.auid]=u.name})}catch(e){}_r.apply(this,arguments);if(home)build();else if(B.classList.contains('sc')){$h('#sth').innerHTML='<i class="ic ic-'+tab+'"></i>'+lab(tab);buildNav();if(tab=='dash')drawDash()}};

var dv=document.createElement('div');dv.id='dashv';$h('main').insertBefore(dv,$h('main').firstChild);var dl=$h('#door .dl img'),lsrc=$h('.logo img');if(dl&&lsrc)dl.src=lsrc.src;
var st=$h('#st'),hd=$h('header');if(st&&hd)hd.parentNode.insertBefore(st,hd);

var DAY=864e5;
function z(a,e){return L=='ar'?a:e}
function dleft(d){return d.review?Math.ceil((d.review-Date.now())/DAY):null}
window.metaB=function(d){var h='';
 if(d.code)h+='<span class="mb c">'+esc(d.code)+'</span>';
 var n=dleft(d);
 if(n!==null){var dt=new Date(d.review).toLocaleDateString(L=='ar'?'ar':'en-GB');
  if(n<0)h+='<span class="mb d"><i class="ic ic-bell"></i> '+z('انتهت مهلة المراجعة','Review overdue')+' · '+dt+'</span>';
  else if(n<=30)h+='<span class="mb w"><i class="ic ic-bell"></i> '+z('مراجعة بعد '+n+' يوم','Review in '+n+' days')+'</span>';
  else h+='<span class="mb n"><i class="ic ic-cal"></i> '+z('المراجعة: ','Review: ')+dt+'</span>'}
 return h?'<br>'+h:''};
function dash(){var el=$h('#hd');if(!el)return;
 var cur=[...docs.entries()].filter(function(e){return!e[1].ref}).map(function(e){return Object.assign({id:e[0]},e[1])});
 var od=cur.filter(function(d){var n=dleft(d);return n!==null&&n<0}),sn=cur.filter(function(d){var n=dleft(d);return n!==null&&n>=0&&n<=30});
 var al=od.concat(sn).slice(0,3).map(function(d){var n=dleft(d);return '<button class="al" data-go="cur">'+esc(d.current.name)+'<small>'+(n<0?z('متأخرة '+(-n)+' يوم','Overdue by '+(-n)+' days'):z('بعد '+n+' يوم','In '+n+' days'))+'</small></button>'}).join('');
 var c1='<div class="dc"><h4><i class="ic ic-bell"></i>'+z('تنبيهات المراجعة','Review alerts')+'</h4><div class="big'+(od.length?' r':'')+'">'+(od.length+sn.length)+'</div><div style="font-size:12px;opacity:.7;margin:4px 0 8px">'+(od.length?z(od.length+' منتهية · '+sn.length+' قريبة',od.length+' overdue · '+sn.length+' due soon'):z('لا مراجعات متأخرة','Nothing overdue'))+'</div>'+al+'</div>';
 var ty={};cur.forEach(function(d){ty[d.ext||'—']=(ty[d.ext||'—']||0)+1});
 var tl=Object.keys(ty).sort(function(a,b){return ty[b]-ty[a]}).slice(0,5),mx=Math.max.apply(null,tl.map(function(k){return ty[k]}).concat([1]));
 var c2='<div class="dc"><h4><i class="ic ic-chart"></i>'+z('السارية حسب النوع','Current by type')+'</h4>'+(tl.length?tl.map(function(k){return '<div class="br"><em style="text-align:start">'+esc(k.toUpperCase())+'</em><i style="width:'+Math.round(ty[k]/mx*100)+'px"></i><em>'+ty[k]+'</em></div>'}).join(''):'<div style="font-size:12px;opacity:.6">—</div>')+'</div>';
 var days=[];for(var i=6;i>=0;i--){var d0=new Date();d0.setHours(0,0,0,0);d0=d0.getTime()-i*DAY;days.push([d0,0])}
 logs.forEach(function(l){days.forEach(function(x){if(l.at>=x[0]&&l.at<x[0]+DAY)x[1]++})});
 var m2=Math.max.apply(null,days.map(function(x){return x[1]}).concat([1]));
 var c3='<div class="dc"><h4><i class="ic ic-act"></i>'+z('النشاط خلال 7 أيام','Activity · 7 days')+'</h4><div class="sp7">'+days.map(function(x){return '<i title="'+x[1]+'" style="height:'+Math.max(6,Math.round(x[1]/m2*100))+'%"></i>'}).join('')+'</div></div>';
 el.innerHTML=c1+c2+c3}
var mid=null;
function openMeta(id){var d=docs.get(id);if(!d)return;mid=id;
 $h('#mmh').textContent=d.current.name;$h('#mml1').textContent=z('رمز المستند','Document code');$h('#mml2').textContent=z('دورة المراجعة','Review cycle');$h('#mml3').textContent=z('تاريخ المراجعة القادمة','Next review date');
 $h('#mmy').innerHTML=[[0,z('بدون','None')],[3,z('كل 3 أشهر','Every 3 months')],[6,z('كل 6 أشهر','Every 6 months')],[12,z('كل سنة','Every year')],[24,z('كل سنتين','Every 2 years')]].map(function(o){return '<option value="'+o[0]+'">'+o[1]+'</option>'}).join('');
 $h('#mmc').value=d.code||'';$h('#mmy').value=String(d.cycle||0);$h('#mmd').value=d.review?new Date(d.review).toISOString().slice(0,10):'';
 $h('#mms').textContent=z('حفظ','Save');$h('#mmx').textContent=z('إلغاء','Cancel');$h('#mm').classList.add('on')}

 if(e.target.closest&&e.target.closest('#mms')){var d=docs.get(mid);if(!d)return;var c=$h('#mmc').value.trim(),y=+$h('#mmy').value,v=$h('#mmd').value;
  var u={code:c,cycle:y,review:v?new Date(v+'T00:00:00').getTime():0};
  Promise.resolve(db.doc('docs/'+mid).update(u)).then(function(){docs.set(mid,Object.assign({},d,u));$h('#mm').classList.remove('on');render()}).catch(function(){$h('#mm').classList.remove('on')})}});

var dashAnim=false;
function fmtN(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,',')}
function pal(i){return ['#2E9BD6','#7cc8f2','#1F6FB0','#7b4fd1','#e09b1a','#1e9e63','#d64545'][i%7]}
function ic(k){return '<i class="ic ic-'+k+'"></i>'}
function donut(parts,center,sub){var R=42,C=2*Math.PI*R,tot=parts.reduce(function(s,p){return s+p.v},0),acc=0,sg='';
 if(!tot)sg='<circle cx="60" cy="60" r="'+R+'" fill="none" stroke="var(--ln)" stroke-width="14"/>';
